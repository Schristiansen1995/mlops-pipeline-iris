stages:
  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - src/validar_datos.py
      - src/validacion_ge.py
      - contrato/contrato_datos.json
      - data/processed/train.csv
      - data/processed/test.csv
    outs:
      - models/model.pkl
  test:
    cmd: pytest tests/
    deps:
      - src/
      - tests/
      - data/processed/train.csv
      - data/processed/test.csv
      - models/model.pkl
